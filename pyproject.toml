[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    "var",
    ".odoo_stubs",
]

[tool.ruff.lint]
ignore = [
    "RUF012",  # Mutable class attributes in Odoo models (_sql_constraints, _inherit, etc.)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]
