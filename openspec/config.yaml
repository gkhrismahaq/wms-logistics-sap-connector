      | [Deskripsi risiko] | Low / Medium / High | [Langkah pencegahan/penanganan] |

  tasks:
    - |
      STRICT FORMAT for tasks.md:
      Headings in English. Body content in Indonesian.

      # Implementation Tasks: {Change Name in Title Case}

      <!-- STRICT RULES:
      1. Every task MUST use format: - [ ] {Number}.{Sub} [{Domain}] {Action-oriented description}
      2. Domain tag MUST be one of: [Backend], [Security], [UI], [Integration], [Test]
      3. MUST specify target file path in backticks (`addons/...`)
      4. Task duration MUST NOT exceed 2 hours per item.
      5. Strictly follow phase order: Foundation/Model -> Security -> UI -> Logic/API -> Verification.
      -->

      ## 1. Data Model & Backend Foundation
      - [ ] 1.1 [Backend] {Deskripsi implementasi model/field pada target file `addons/wms_sap_connector/...`}
      - [ ] 1.2 [Backend] {Pendaftaran model pada `__init__.py`}

      ## 2. Security & Access Control
      - [ ] 2.1 [Security] {Konfigurasi hak akses model pada `addons/wms_sap_connector/security/ir.model.access.csv`}
      - [ ] 2.2 [Security] {Konfigurasi security groups pada `addons/wms_sap_connector/security/security.xml` jika relevan}

      ## 3. User Interface & Views
      - [ ] 3.1 [UI] {Pembuatan view Tree/Form/Search pada `addons/wms_sap_connector/views/...`}
      - [ ] 3.2 [UI] {Pendaftaran menu item dan action pada views}
      - [ ] 3.3 [Backend] {Pendaftaran file XML views pada `__manifest__.py`}

      ## 4. Business Logic & Integration Endpoints
      - [ ] 4.1 [Integration] {Implementasi controller/service logic pada `addons/wms_sap_connector/...`}
      - [ ] 4.2 [Backend] {Implementasi validasi dan error handling}

      ## 5. Verification & Testing
      - [ ] 5.1 [Test] {Upgrade modul via `make addon wms_sap_connector` dan verifikasi log bersih dari error/warning}
      - [ ] 5.2 [Test] {Pengujian fungsional skenario Happy Path dan Edge Case sesuai spec.md}

operations:
  apply:
    guidance:
      - Implementation MUST strictly follow tasks.md in sequential order.
      - During implementation, update `- [ ]` to `- [x]` immediately after each task is fully verified.
      - MUST NOT add logic, fields, or endpoints not defined in spec.md or design.md.
      - MUST preserve all existing docstrings, comments, and Odoo coding standards.
      - Run verification (`make addon wms_sap_connector` or automated test) before marking tasks complete.
