schema: spec-driven

# ==============================================================================
# PROJECT CONTEXT — WMS LOGISTICS SAP CONNECTOR
# ==============================================================================
# This is the implementation repository for Odoo 17 WMS & Logistics Execution,
# integrated with SAP (Upper Line) using Two-Tier ERP Architecture.
# NO code change may begin without an approved OpenSpec proposal.
# ==============================================================================

context: |
  Project Name  : WMS Logistics SAP Connector
  Description   : Odoo 17 Two-Tier WMS & Logistics Execution System integrated with SAP Upper Line.
  App Platform  : Odoo 17 (Python Backend, XML Views, PostgreSQL, REST API Connector).
  Methodology   : Spec-Driven Development (OpenSpec).

  SSOT Docs : /Users/gilangkhrismahaq/Projects/wms-logistics-sap-connector/docs
  Impl Repo : /Users/gilangkhrismahaq/Projects/wms-logistics-sap-connector

  System Roles:
  - Kepala Gudang (Warehouse Manager) : Full control over inventory, locations, layout, and audit logs.
  - Staf Gudang (Picker / Packer)     : Barcode scan, picking, packing, putaway validation.
  - Dispatcher / Logistik             : Fleet assignment, surat jalan, dispatching.
  - Supir / Kurir                     : Proof of Delivery (POD) execution.
  - SAP Integration Service           : Automated inbound/outbound REST sync.

  # ============================================================================
  # SSOT DOCUMENT MAP
  # ============================================================================

  Core Blueprints (in docs/):
  - tsd.md       : Business & Technical Specs (BRD, FSD, TSD, Integration Protocol).
  - roadmap.md   : Master plan for all changes and capabilities.

  # ============================================================================
  # HARD TECHNICAL CONSTRAINTS
  # ============================================================================

  1. MUST follow Odoo 17 standards (ORM, XML Views, Controllers, Inheritance).
  2. MUST safely inherit standard models (stock.picking, stock.location, product.template, res.partner).
  3. Security rules MUST be defined strictly in ir.model.access.csv and security.xml.
  4. Integration endpoints MUST be idempotent, authenticated, and log every payload in sap_sync_log.
  5. Language Rule: All markdown headings MUST be in English. All body explanations MUST be in formal Indonesian.
  6. Code Naming: Exact Odoo model names, field names, and file paths MUST be wrapped in backticks (`model.name`).

# ==============================================================================
# STRICT ARTIFACT RULES
# ==============================================================================

rules:

  proposal:
    - |
      STRICT FORMAT for proposal.md:
      Headings in English. Body content in Indonesian.

      # Proposal: {Change Name in Title Case}

      | Field              | Value                                         |
      |--------------------|-----------------------------------------------|
      | **Change Name**    | {kebab-case-change-name}                      |
      | **Roadmap Phase**  | Fase {Number}: {Phase Name}                   |
      | **Target Cap.**    | `{capability-name}`                           |
      | **Est. Effort**    | {X} Hours                                     |
      | **Risk Level**     | Low / Medium / High                           |

      ## Why
      [Penjelasan masalah bisnis atau kebutuhan teknis yang melatarbelakangi change ini]
      > **Reference:** [tsd.md](../../docs/tsd.md) — Bagian {X.Y} dan [roadmap.md](../../docs/roadmap.md) — Fase {X.Y}.

      ## What Changes
      [Ringkasan perubahan yang akan dilakukan, dikelompokkan berdasarkan domain teknis]
      - **Backend (ORM & Models):** [Rincian perubahan model/field]
      - **Security & Access Rights:** [Rincian hak akses/group]
      - **Views & UI:** [Rincian form/tree/menu]
      - **Integration & API:** [Rincian endpoint/webhook/log jika relevan]

      ## Capabilities
      ### New Capabilities
      - `{capability-name}`: [Deskripsi 1 kalimat mengenai kapabilitas baru yang ditambahkan]

      ### Modified Capabilities
      - `{capability-name}`: [Deskripsi kapabilitas yang diubah, atau 'None']

      ### Removed Capabilities
      - `None`

      ## Impact & Scope
      - **Files to Create:**
        - `addons/wms_sap_connector/...`
      - **Files to Modify:**
        - `addons/wms_sap_connector/...`
      - **SSOT Documents Referenced:**
        - `docs/tsd.md` (Bagian X.Y)
        - `docs/roadmap.md` (Capability X.Y)
      - **Estimated Effort:** {X} jam.
      - **Complexity & Risk Analysis:** [Penjelasan singkat risiko dan cara mitigasinya].

  specs:
    - |
      STRICT FORMAT for specs/{capability-name}/spec.md:
      Headings in English. Body content in Indonesian. Must follow OpenSpec Delta Specs format.

      # Specification: {Capability Name in Title Case}

      ## Purpose
      [Penjelasan terperinci mengenai fungsi kapabilitas ini bagi operasional WMS atau integrasi SAP]

      ## ADDED Requirements
      ### Requirement: [REQ-{CAP}-{01}] {Nama Requirement}
      The system MUST {pernyataan normatif menggunakan RFC 2119 keywords: MUST / MUST NOT / SHOULD / MAY}.
      > **Reference:** [tsd.md](../../docs/tsd.md) — Bagian {X.Y}

      [Rincian atribut, field types, validasi bisnis, atau batasan sistem]

      #### Scenario: {Nama Skenario Sukses / Happy Path}
      - **GIVEN** {Kondisi awal sistem, status record, atau ketersediaan data}
      - **WHEN** {Aksi pengguna, pemicu event, atau panggilan API}
      - **THEN** {Kondisi akhir sistem, mutasi status, dan efek samping yang dihasilkan}

      #### Scenario: {Nama Skenario Gagal / Edge Case}
      - **GIVEN** {Kondisi sistem saat data tidak valid atau terjadi galat}
      - **WHEN** {Aksi yang memicu kondisi galat}
      - **THEN** {Respon penolakan sistem, rollback, atau pencatatan error log}

      ## MODIFIED Requirements
      (Cantumkan jika ada requirement yang diubah dari spek utama sebelumnya, atau 'None')

      ## REMOVED Requirements
      (Cantumkan jika ada requirement yang dihapus, atau 'None')

  design:
    - |
      STRICT FORMAT for design.md:
      Headings in English. Body content in Indonesian. Follows Architecture Decision Record (ADR) standard.

